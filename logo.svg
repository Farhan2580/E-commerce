<svg width="500" height="130" viewBox="0 0 500 130" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>GadgetFlow Logo</title>
  <defs>
    <style>
      .logo-pulse {
        animation: pulse 2s ease-in-out infinite;
        transform-origin: 50px 65px;
      }
      .bolt-flash {
        animation: flash 2s ease-in-out infinite;
      }
      .text-slide {
        animation: slideIn 0.8s ease-out forwards;
      }
      .tag-fade {
        animation: fadeUp 1.2s ease-out 0.4s both;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
      @keyframes flash {
        0%, 100% { fill: #FF6B00; opacity: 1; }
        50% { fill: #ffaa00; opacity: 0.7; }
      }
      @keyframes slideIn {
        from { opacity: 0; transform: translateX(-18px); }
        to   { opacity: 1; transform: translateX(0); }
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    </style>
  </defs>

  <!-- Icon badge with pulse -->
  <g class="logo-pulse">
    <rect x="10" y="20" width="88" height="88" rx="20" fill="#FF6B00"/>
    <!-- Cart body -->
    <rect x="28" y="52" width="50" height="30" rx="6" fill="white"/>
    <!-- Cart handle -->
    <path d="M28 52 L23 34 L17 34" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Wheels -->
    <circle cx="41" cy="86" r="6" fill="white"/>
    <circle cx="65" cy="86" r="6" fill="white"/>
    <!-- Lightning bolt -->
    <path d="M47 45 L40 61 L49 61 L42 77 L62 56 L53 56 L60 45 Z" class="bolt-flash"/>
  </g>

  <!-- GADGET -->
  <text
    x="114" y="82"
    font-family="'Arial Black', Arial, sans-serif"
    font-weight="900"
    font-size="48"
    fill="#1a1a2e"
    class="text-slide"
  >Gadget</text>

  <!-- FLOW in orange -->
  <text
    x="322" y="82"
    font-family="'Arial Black', Arial, sans-serif"
    font-weight="900"
    font-size="48"
    fill="#FF6B00"
    class="text-slide"
  >Flow</text>

  <!-- Tagline -->
  <text
    x="116" y="106"
    font-family="Arial, sans-serif"
    font-size="13"
    fill="#888888"
    letter-spacing="3.5"
    class="tag-fade"
  >TECH. CONNECTED.</text>

  <!-- Underline accent -->
  <rect x="114" y="112" width="270" height="3" rx="2" fill="#FF6B00" opacity="0.35" class="tag-fade"/>
</svg>
