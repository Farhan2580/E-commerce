{% extends 'base.html' %}
{% load static %}

{% block content %}
<!-- Font Awesome for icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<div class="min-h-[80vh] flex items-center justify-center py-20 px-4 relative overflow-hidden">
    
    <!-- Ambient Background Elements -->
    <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-orange-400/5 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-0 left-0 w-[500px] h-[500px] bg-purple-500/5 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="max-w-md w-full relative z-10 animate-fade-in text-center">
        
        <!-- Animated Icon Container -->
        <div class="relative inline-block mb-12">
            <div class="absolute -inset-4 bg-gradient-to-tr from-orange-500 to-purple-600 rounded-[2.5rem] opacity-20 blur-xl animate-pulse"></div>
            <div class="relative bg-white p-8 rounded-[2.5rem] shadow-2xl border border-gray-50 flex items-center justify-center transform hover:scale-110 transition-transform duration-500">
                <i class="fa-solid fa-arrow-right-from-bracket text-4xl text-[#0b0f1a]"></i>
            </div>
        </div>

        <!-- Text Content -->
        <h1 class="text-4xl md:text-5xl font-[900] text-[#0b0f1a] tracking-tight uppercase italic leading-none mb-6">
            Signed <span class="text-orange-500">Out</span>
        </h1>
        <p class="text-gray-400 font-bold tracking-[0.3em] uppercase text-[10px] mb-12 leading-relaxed">
            You have been securely logged out.<br>See you again soon!
        </p>

        <!-- Action Buttons -->
        <div class="flex flex-col gap-4">
            <a href="{% url 'login' %}" class="group relative overflow-hidden rounded-2xl bg-[#0b0f1a] py-5 text-white shadow-xl transition-all duration-500 hover:shadow-orange-500/20">
                <div class="absolute inset-0 bg-gradient-to-r from-orange-500 to-purple-600 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                <span class="relative z-10 text-[10px] font-black uppercase tracking-[0.4em] flex items-center justify-center gap-3">
                    Sign Back In
                </span>
            </a>
            
            <a href="{% url 'home' %}" class="py-5 bg-white border border-gray-100 rounded-2xl text-[10px] font-black text-gray-400 uppercase tracking-[0.4em] hover:text-[#0b0f1a] hover:border-gray-300 transition-all duration-300">
                Go to Homepage
            </a>
        </div>

    </div>
</div>

<style>
    @keyframes fade-up {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
        animation: fade-up 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
</style>
{% endblock %}
