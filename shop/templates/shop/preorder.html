{% extends 'base.html' %}
{% block content %}
    <div class="gf-shell gf-page gf-narrow">
        <section class="gf-panel"><h1>Request a preorder.</h1>
            <p>Tell us what you’re looking for. This is a request, not a confirmed purchase or payment.</p>
            <form method="post" enctype="multipart/form-data" class="gf-form">{% csrf_token %}{{ form.as_p }}
                <button class="gf-button gf-button-primary">Send preorder request</button>
            </form>
        </section>
    </div>{% endblock %}
