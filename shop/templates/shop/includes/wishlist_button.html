{% if user.is_authenticated %}
<form action="{% url 'toggle_wishlist' product.pk %}" method="post" data-wishlist-form data-product-id="{{ product.pk }}" data-product-name="{{ product.name }}">{% csrf_token %}
    <input type="hidden" name="action" value="{% if product.pk in wishlist_ids %}remove{% else %}save{% endif %}">
    <button class="{% if show_wishlist_label %}gf-button gf-button-secondary{% else %}gf-save-button{% endif %}"
            aria-label="{% if product.pk in wishlist_ids %}Remove {{ product.name }} from wishlist{% else %}Save {{ product.name }} to wishlist{% endif %}"
            aria-pressed="{% if product.pk in wishlist_ids %}true{% else %}false{% endif %}">
        <span data-wishlist-icon aria-hidden="true">{% if product.pk in wishlist_ids %}♥{% else %}♡{% endif %}</span>
        {% if show_wishlist_label %}<span data-wishlist-label>{% if product.pk in wishlist_ids %}Saved to wishlist{% else %}Save to wishlist{% endif %}</span>{% endif %}
    </button>
</form>
{% else %}
<a class="{% if show_wishlist_label %}gf-button gf-button-secondary{% else %}gf-save-button gf-guest-save{% endif %}" href="{% url 'login' %}?next={{ request.path|urlencode }}" aria-label="Sign in to save {{ product.name }} to wishlist"><span aria-hidden="true">♡</span>{% if show_wishlist_label %} Sign in to save{% endif %}</a>
{% endif %}
