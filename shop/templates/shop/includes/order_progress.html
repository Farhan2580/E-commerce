{% if order_progress %}<ol class="gf-order-progress" aria-label="Order progress">{% for step in order_progress %}<li class="{% if step.complete %}is-complete{% endif %}{% if step.current %} is-current{% endif %}" {% if step.current %}aria-current="step"{% endif %}><span aria-hidden="true">{% if step.complete %}✓{% else %}{{ forloop.counter }}{% endif %}</span><strong>{{ step.label }}</strong></li>{% endfor %}</ol>{% endif %}
