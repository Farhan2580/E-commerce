{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextGen | Explorer</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --ag-orange: #ff6600;
            --ag-purple: #8b5cf6;
            --ag-black: #0f172a;
            --ag-bg: #fcfcfd;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0; background-color: var(--ag-bg); color: var(--ag-black);
        }

        /* --- Navbar --- */
        .navbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px 5%; background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 1000;
            border-bottom: 1px solid rgba(0,0,0,0.03);
        }

        .cart-badge {
            background: var(--ag-orange); color: white; padding: 5px 12px;
            border-radius: 12px; font-weight: 800; font-size: 12px;
        }

        /* --- Search & Filter Bar --- */
        .search-section {
            padding: 40px 5%; background: #fff; border-bottom: 1px solid #f1f5f9;
            display: flex; gap: 20px; align-items: center; justify-content: center;
        }

        .search-container {
            background: #f1f5f9; border-radius: 20px; padding: 10px 25px;
            display: flex; align-items: center; width: 500px; border: 2px solid transparent;
            transition: 0.3s;
        }

        .search-container:focus-within { border-color: var(--ag-purple); background: white; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }

        .search-container input {
            border: none; background: transparent; outline: none; width: 100%;
            font-weight: 600; font-size: 16px;
        }

        select {
            padding: 15px 25px; border-radius: 20px; border: none;
            background: #f1f5f9; font-weight: 700; cursor: pointer; outline: none;
        }

        /* --- Product Grid --- */
        .container { padding: 60px 5%; }
        .product-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 40px;
        }

        .product-card {
            background: #fff; border-radius: 50px; padding: 30px;
            transition: 0.5s cubic-bezier(0.2, 1, 0.3, 1); border: 1px solid #f1f5f9;
        }

        .product-card:hover { transform: translateY(-15px); box-shadow: 0 40px 80px rgba(0,0,0,0.06); }

        .image-wrapper {
            background: #f8fafc; border-radius: 40px; padding: 40px;
            margin-bottom: 25px; display: flex; justify-content: center;
        }

        .image-wrapper img { height: 180px; object-fit: contain; transition: 0.5s; }
        .product-card:hover img { transform: scale(1.1) rotate(3deg); }

        .product-name { font-size: 22px; font-weight: 800; margin-bottom: 15px; min-height: 54px; }
        .product-price { font-size: 32px; font-weight: 900; font-style: italic; color: var(--ag-black); }

        .preview-btn {
            width: 100%; padding: 18px; border: none; border-radius: 20px;
            background: var(--ag-black); color: white; font-weight: 800;
            text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: 0.3s;
            margin-top: 20px;
        }

        .preview-btn:hover { background: var(--ag-orange); }

        /* --- Modern Modal --- */
        .modal {
            display: none; position: fixed; z-index: 2000; left: 0; top: 0;
            width: 100%; height: 100%; background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
        }

        .modal-content {
            background: #fff; margin: 5% auto; padding: 50px; border-radius: 60px;
            width: 90%; max-width: 500px; position: relative; text-align: center;
            animation: modalSlide 0.4s cubic-bezier(0.2, 1, 0.3, 1);
        }

        @keyframes modalSlide { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        #modal-close {
            position: absolute; top: 30px; right: 30px; background: #f1f5f9;
            border: none; width: 40px; height: 40px; border-radius: 50%;
            font-size: 20px; cursor: pointer;
        }

        .modal-actions { display: flex; gap: 15px; margin-top: 30px; }
        .btn-modal {
            flex: 1; padding: 20px; border-radius: 20px; text-decoration: none;
            font-weight: 800; text-transform: uppercase; font-size: 12px;
        }
        .btn-primary { background: var(--ag-black); color: white; }
        .btn-secondary { background: #f1f5f9; color: var(--ag-black); }

    </style>
</head>
<body>

<nav class="navbar">
    <div style="font-weight: 900; font-size: 24px; letter-spacing: -1px;">GADGET<span style="color: var(--ag-purple);">FLOW</span></div>
    <div class="cart-badge"><i class="fa-solid fa-cart-shopping"></i> {{ cart_count }}</div>
</nav>

<div class="search-section">
    <div class="search-container">
        <i class="fa-solid fa-magnifying-glass" style="color: #94a3b8; margin-right: 15px;"></i>
        <input id="search-input" placeholder="Search future gadgets..." autocomplete="off">
    </div>
    <select id="sort-select">
        <option value="">SORT BY</option>
        <option value="price_asc">Price: Low to High</option>
        <option value="price_desc">Price: High to Low</option>
    </select>
</div>

<div class="container">
    <div class="product-grid" id="product-grid">
        <!-- JS insertion -->
    </div>
    <div id="no-result" style="display:none; text-align:center; padding:100px;">
        <i class="fa-solid fa-robot-dead" style="font-size: 50px; color: #cbd5e1;"></i>
        <p style="font-weight:800; color:#94a3b8; margin-top:20px; text-transform:uppercase;">No results found in this dimension.</p>
    </div>
</div>

<!-- Modal -->
<div id="product-modal" class="modal">
    <div class="modal-content">
        <button id="modal-close">&times;</button>
        <div style="background:#f8fafc; border-radius:40px; padding:40px; margin-bottom:30px;">
            <img id="modal-img" src="" style="width:100%; height:250px; object-fit:contain;">
        </div>
        <h3 id="modal-name" style="font-size:28px; font-weight:800; margin:0 0 10px 0;"></h3>
        <p id="modal-price" style="font-size:36px; font-weight:900; font-style:italic; color:var(--ag-orange);"></p>

        <div class="modal-actions">
            <a id="modal-details" href="#" class="btn-modal btn-secondary">Full Specs</a>
            <a id="modal-cart" href="#" class="btn-modal btn-primary">Add to Bag</a>
        </div>
    </div>
</div>

<script>
// Logic remains similar but with updated UI class names
async function fetchProducts() {
  const q = document.getElementById('search-input').value;
  const sort = document.getElementById('sort-select').value;
  try {
    const res = await fetch(`{% url 'ajax_products' %}?q=${encodeURIComponent(q)}&sort=${sort}`);
    const json = await res.json();
    const grid = document.getElementById('product-grid');
    const noResult = document.getElementById('no-result');
    grid.innerHTML = '';

    if (json.products.length === 0) {
      noResult.style.display = 'block';
      return;
    } else {
      noResult.style.display = 'none';
    }

    json.products.forEach(p => {
      const card = document.createElement('div');
      card.className = 'product-card';
      card.innerHTML = `
        <div class="image-wrapper">
            <img src="${p.image}" alt="${p.name}">
        </div>
        <div style="color:var(--ag-orange); font-size:10px; font-weight:900; letter-spacing:2px;">LIMITED EDITION</div>
        <div class="product-name">${p.name}</div>
        <div class="product-price">৳${p.price}</div>
        <button class="preview-btn" data-id="${p.id}" data-img="${p.image}" data-name="${p.name}" data-price="${p.price}">Quick View</button>
      `;

      card.querySelector('button').addEventListener('click', (e) => {
        const btn = e.currentTarget;
        openModal(btn.dataset.id, btn.dataset.img, btn.dataset.name, btn.dataset.price);
      });
      grid.appendChild(card);
    });
  } catch (err) { console.error(err); }
}

function openModal(id, img, name, price) {
  document.getElementById('modal-img').src = img;
  document.getElementById('modal-name').innerText = name;
  document.getElementById('modal-price').innerText = '৳' + price;
  document.getElementById('modal-details').href = `/product/${id}/`;
  document.getElementById('modal-cart').href = `/add-to-cart/${id}/`;
  document.getElementById('product-modal').style.display = 'block';
}

function closeModal() { document.getElementById('product-modal').style.display = 'none'; }

document.getElementById('modal-close').addEventListener('click', closeModal);
window.onclick = (e) => { if(e.target == document.getElementById('product-modal')) closeModal(); };
document.getElementById('search-input').addEventListener('input', fetchProducts);
document.getElementById('sort-select').addEventListener('change', fetchProducts);
window.addEventListener('DOMContentLoaded', fetchProducts);
</script>

</body>
</html>
