{% extends 'base.html' %}
{% block content %}
    <div class="gf-shell gf-page gf-narrow">
        <section class="gf-panel"><h1>Create your account.</h1>
            <form method="post" class="gf-form">{% csrf_token %}{{ form.as_p }}
                <button class="gf-button gf-button-primary">Create account</button>
            </form>
            <p>Already registered? <a href="{% url 'login' %}">Sign in</a></p></section>
    </div>{% endblock %}
